[project]
name = "KodiDevKit"
requires-python = ">=3.8"

[tool.ruff]
exclude = ["libs/polib", "debug_scripts"]
target-version = "py38"

[tool.ruff.lint]
# Stated rather than inherited: ruff 0.16 widened its default set, which changed
# what CI enforced without anything here changing.
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"libs/polib/__init__.py" = ["F401", "F403"]
"tests/*.py" = ["E402"]
"tests/scripts/*.py" = ["E402", "F541"]
"typings/*.pyi" = ["F401", "F811"]
