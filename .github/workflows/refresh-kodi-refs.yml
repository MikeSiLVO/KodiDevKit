name: Refresh Kodi reference data

on:
  schedule:
    # Weekly. Piers tracks master, so upstream moves between Kodi releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # A PAT lets the PRs trigger CI and lets the kdk half run at all; without
      # one this still opens the KodiDevKit PR, just unchecked and unmirrored.
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # kdk is public, so the default token reads it. Only the PR step below
      # needs SYNC_TOKEN, and a bad token should not kill the whole run here.
      - name: Check out kdk
        uses: actions/checkout@v5
        with:
          repository: MikeSiLVO/kdk
          path: .kdk-checkout

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install lxml

      - name: Fetch upstream snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_kodi_refs.py

      # The refresh PR gets no push-triggered CI unless SYNC_TOKEN is set, so
      # prove the new data still validates before anyone is asked to merge it.
      - name: Run test suite against the new data
        run: python tests/run_tests.py

      - name: Mirror the new data into kdk
        run: python scripts/sync_engine.py --apply --kdk .kdk-checkout

      # Both halves must land together: the sync job compares KodiDevKit against
      # kdk's default branch, so merging one alone leaves main red.
      - name: Open a PR on KodiDevKit
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: kodi-refs-refresh
          title: "Update Kodi reference snapshots"
          commit-message: "Update Kodi reference snapshots"
          body: |
            Automated refresh from `xbmc/xbmc` via `scripts/update_kodi_refs.py`.

            Review the diff before merging: changes to `colors.xml` or
            `strings.po` alter what validation reports.

            Merge the matching kdk PR at the same time, or CI here stays red
            until the two trees match again.
          delete-branch: true

      - name: Open the matching PR on kdk
        if: env.SYNC_TOKEN != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: .kdk-checkout
          branch: kodi-refs-refresh
          title: "Update Kodi reference snapshots"
          commit-message: "Update Kodi reference snapshots"
          body: |
            Mirrored from KodiDevKit by `scripts/sync_engine.py --apply`.

            Merge alongside the KodiDevKit PR of the same name.
          delete-branch: true

      - name: Warn when the kdk half was skipped
        if: env.SYNC_TOKEN == ''
        run: |
          echo "::warning::No SYNC_TOKEN, so kdk was not updated. After merging" \
               "the KodiDevKit PR, run scripts/sync_engine.py --apply against kdk" \
               "and merge that too, or the sync job stays red."
