name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Sublime is mocked by tests/mock_sublime.py; lxml is the only real dep
      # the engine needs outside the editor.
      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python tests/run_tests.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      # kdk vendors this engine and has no Sublime. loader.py and files.py are
      # the two host-abstraction points, both with fallbacks so kdk runs them
      # unchanged; anywhere else an editor import breaks kdk.
      - name: Engine must not import the editor
        shell: bash
        run: |
          hits=$(grep -rn "import sublime" --include=*.py libs \
            | grep -vE "libs/(sublime|kodi)/" \
            | grep -vE "(tooltips|navigation|sublime_helpers|decorators)\.py" \
            | grep -vE "libs/reporting/(html|server)\.py" \
            | grep -vE "libs/(infoprovider/loader|utils/files)\.py" || true)
          if [ -n "$hits" ]; then
            echo "Editor import in shared engine code:"; echo "$hits"; exit 1
          fi
          echo "engine is editor-free (loader.py + files.py host abstractions excepted)"

  sync:
    name: engine mirrors kdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Paired branches share a name in both repos; against kdk main they read as drift.
      - name: Pick the kdk branch to compare against
        id: kdk
        shell: bash
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/MikeSiLVO/kdk "$branch" >/dev/null 2>&1; then
            echo "kdk branch: $branch"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "kdk branch: default"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out kdk
        uses: actions/checkout@v5
        with:
          repository: MikeSiLVO/kdk
          ref: ${{ steps.kdk.outputs.ref }}
          path: .kdk-checkout

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fails on any difference in a mirrored file that isn't declared in the
      # script's EXEMPT map. Silent drift here is what forked the two trees.
      - name: Check for engine drift
        run: python scripts/sync_engine.py --check --kdk .kdk-checkout
